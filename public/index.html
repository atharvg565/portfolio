<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Atharv Gupta: developer and digital creator. Projects, skills and contact.">
  <meta name="theme-color" content="#7a1a3a">
  <title>Atharv's Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@700&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="fog" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>

  <header class="bar">
    <a class="brand" href="#/">AMMAR</a>
    <a id="home-link" href="#/" hidden>◀ MENU</a>
    <div class="audio">
      <button id="music" aria-pressed="false">MUSIC OFF</button>
      <label class="vol">VOL <input id="vol" type="range" min="0" max="100" value="25" aria-label="Music volume"></label>
      <button id="sfx" aria-pressed="false">SFX OFF</button>
    </div>
  </header>
  <div class="ticker" aria-hidden="true"><span>★ WELCOME TO ATHARV'S SPACE ★ PROJECTS · SKILLS · CONNECT ★ THANKS FOR STOPPING BY ★ BUILT WITH TOO MUCH COFFEE ★</span></div>

  <main id="view" tabindex="-1"></main>
  <footer class="foot" id="foot">↑ ↓ MOVE · ENTER SELECT · ESC BACK</footer>

  <div id="splash" role="button" tabindex="0" aria-label="Press any key to enter">
    <div class="burst" aria-hidden="true">★</div>
    <p class="s-small">Atharv's</p>
    <h1 class="sticker big">PORTFOLIO</h1>
    <p class="press">PRESS ANY KEY TO ENTER</p>
  </div>

  <audio id="bgm" src="audio/theme.mp3" loop preload="none"></audio>
  <script src="data/projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
